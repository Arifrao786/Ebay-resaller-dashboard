<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBay-Tracer by Arif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #001f3f, #0074D9, #7FDBFF, #39CCCC);
            background-size: 400% 400%;
            animation: bgMove 15s ease infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen">

    <!-- AUTH SECTION (Login / Signup) -->
    <div id="auth-section" class="flex items-center justify-center min-h-screen animated-bg p-4">
        <div class="bg-gray-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
            <div class="text-center mb-6">
                <div class="text-3xl font-black tracking-wider text-blue-400 mb-2">
                    <i class="fa-solid fa-satellite-dish"></i> eBay-Tracer <span class="text-white text-lg">by Arif</span>
                </div>
                <p class="text-gray-400 text-sm">Professional Dropshipping & Competitor Intelligence</p>
            </div>

            <!-- Tabs -->
            <div class="flex mb-6 bg-gray-900 p-1 rounded-xl">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition">Login</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 transition">Sign Up</button>
            </div>

            <!-- Form -->
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-2.5 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="auth-password" required class="w-full px-4 py-2.5 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm pr-10">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-3 text-gray-400 hover:text-white">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="auth-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg transition shadow-lg shadow-blue-600/30 text-sm">Login to Dashboard</button>
            </form>
            <div id="auth-msg" class="mt-4 text-center text-xs text-red-400"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD SECTION -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-xl text-white font-black text-xl shadow-md">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wide text-blue-400">eBay-Tracer <span class="text-white text-xs font-normal">by Arif</span></h1>
                    <p class="text-xs text-gray-400">Live Market Intelligence & Dropshipping SaaS</p>
                </div>
            </div>
            <div>
                <button onclick="signOut()" class="px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white text-xs font-semibold rounded-lg transition border border-red-600/30">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Sign Out
                </button>
            </div>
        </header>

        <!-- Dashboard Content Container -->
        <div class="flex flex-1 flex-col md:flex-row">
            <!-- Sidebar Filters -->
            <aside class="w-full md:w-64 bg-gray-800/50 border-r border-gray-700 p-4 space-y-6">
                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Marketplace</h3>
                    <div class="space-y-1">
                        <button onclick="filterMarket('ALL')" class="market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition">All Markets</button>
                        <button onclick="filterMarket('USA')" class="market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition">🇺🇸 USA Market</button>
                        <button onclick="filterMarket('UK')" class="market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition">🇬🇧 UK Market</button>
                        <button onclick="filterMarket('AU')" class="market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition">🇦🇺 Australia Market</button>
                        <button onclick="filterMarket('CA')" class="market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition">🇨🇦 Canada Market</button>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Time Filter</h3>
                    <div class="space-y-1">
                        <button onclick="filterTime('ALL')" class="time-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition">All Products</button>
                        <button onclick="filterTime('TODAY')" class="time-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition">Today's Trending</button>
                        <button onclick="filterTime('YESTERDAY')" class="time-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition">Yesterday's Top</button>
                    </div>
                </div>
            </aside>

            <!-- Main Product Feed Area -->
            <main class="flex-1 p-6 bg-gray-900">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-white flex items-center">
                        <i class="fa-solid fa-fire text-orange-500 mr-2"></i> Winning Products Feed
                    </h2>
                    <button onclick="loadProducts()" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-medium rounded-lg border border-gray-700 transition">
                        <i class="fa-solid fa-rotate mr-1"></i> Refresh Data
                    </button>
                </div>

                <!-- Products Grid -->
                <div id="products-grid" class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    <!-- Dynamic Product Cards will load here -->
                    <div class="text-gray-500 text-sm col-span-2 text-center py-12">Loading live database products...</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Supabase Connection & App Script -->
    <script>
        const SUPABASE_URL = 'https://doqmnxccvnmvcpneeueu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvcW1ueGNjdm5tdmNwbmVldWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjI2NzUsImV4cCI6MjEwNDYzODY3NX0.gy5QA0xh_yx26AZ_0d7upHtjCClBvIv48brdRE8NMhY';
        
        // Initialize Supabase Client safely with full key
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let currentMarket = 'ALL';
        let currentTimeFilter = 'ALL';
        let allProductsData = [];

        function switchAuthTab(tab) {
            isSignUp = (tab === 'signup');
            document.getElementById('tab-login').className = isSignUp ? 'flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 transition' : 'flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition';
            document.getElementById('tab-signup').className = isSignUp ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white transition' : 'flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 transition';
            document.getElementById('auth-btn').innerText = isSignUp ? 'Create Account' : 'Login to Dashboard';
        }

        function togglePassword() {
            const pwdInput = document.getElementById('auth-password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msgEl = document.getElementById('auth-msg');
            msgEl.innerText = '';

            try {
                if (isSignUp) {
                    const { data, error } = await _supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    msgEl.className = 'mt-4 text-center text-xs text-green-400';
                    msgEl.innerText = 'Registration successful! You can now login.';
                } else {
                    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    checkUserSession();
                }
            } catch (err) {
                msgEl.className = 'mt-4 text-center text-xs text-red-400';
                msgEl.innerText = err.message;
            }
        }

        async function signOut() {
            await _supabase.auth.signOut();
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
        }

        async function checkUserSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadProducts();
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '<div class="text-gray-400 text-sm col-span-2 text-center py-12"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Fetching live database records...</div>';

            try {
                const { data, error } = await _supabase.from('products').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allProductsData = data || [];
                renderProducts();
            } catch (err) {
                grid.innerHTML = `<div class="text-red-400 text-sm col-span-2 text-center py-12">Error loading products: ${err.message}</div>`;
            }
        }

        function filterMarket(market) {
            currentMarket = market;
            document.querySelectorAll('.market-btn').forEach(btn => {
                btn.className = btn.innerText.includes(market) || (market === 'ALL' && btn.innerText.includes('All')) 
                    ? 'market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition' 
                    : 'market-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition';
            });
            renderProducts();
        }

        function filterTime(time) {
            currentTimeFilter = time;
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.className = (time === 'ALL' && btn.innerText.includes('All')) || (time === 'TODAY' && btn.innerText.includes('Today')) || (time === 'YESTERDAY' && btn.innerText.includes('Yesterday'))
                    ? 'time-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white transition'
                    : 'time-btn w-full text-left px-3 py-2 text-xs font-medium rounded-lg text-gray-300 hover:bg-gray-700 transition';
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            let filtered = allProductsData;

            if (currentMarket !== 'ALL') {
                filtered = filtered.filter(p => p.market && p.market.toUpperCase() === currentMarket);
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="text-gray-500 text-sm col-span-2 text-center py-12">No products found matching criteria.</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 flex flex-col justify-between space-y-4 shadow-lg">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="px-2 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] font-bold rounded uppercase">${p.market || 'USA'}</span>
                            <h3 class="font-bold text-sm text-white mt-1 line-clamp-1">${p.title || 'Untitled Product'}</h3>
                        </div>
                        <span class="text-green-400 font-extrabold text-base">$${p.price || '0.00'}</span>
                    </div>

                    <!-- Metrics Grid (Competitors & Sales) -->
                    <div class="grid grid-cols-3 gap-2 bg-gray-900/60 p-3 rounded-lg text-center text-xs">
                        <div>
                            <span class="block text-gray-400 text-[10px]">Competitors</span>
                            <span class="font-bold text-white">${p.competitor_count || 0}</span>
                        </div>
                        <div>
                            <span class="block text-gray-400 text-[10px]">Weekly Sales</span>
                            <span class="font-bold text-blue-400">${p.weekly_sales || '20+'}</span>
                        </div>
                        <div>
                            <span class="block text-gray-400 text-[10px]">Total Sales</span>
                            <span class="font-bold text-purple-400">${p.total_sales || '1k+'}</span>
                        </div>
                    </div>

                    <!-- Action Links -->
                    <div class="flex space-x-2 pt-2 border-t border-gray-700">
                        <a href="${p.ebay_url || '#'}" target="_blank" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-center text-xs font-bold rounded-lg transition text-white shadow">
                            <i class="fa-solid fa-cart-shopping mr-1"></i> View on eBay
                        </a>
                        <a href="${p.aliexpress_url || '#'}" target="_blank" class="flex-1 py-2 bg-orange-600 hover:bg-orange-500 text-center text-xs font-bold rounded-lg transition text-white shadow">
                            <i class="fa-solid fa-box-open mr-1"></i> Find on AliExpress
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Run session check on page load
        window.onload = checkUserSession;
    </script>
</body>
</html>
