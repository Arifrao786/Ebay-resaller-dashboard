<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay-Tracer by Arif - Reseller Portal</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 30s linear infinite;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .animate-logo {
      animation: pulseLogo 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- AUTH / LANDING CONTAINER -->
  <div id="auth-container" class="relative flex items-center justify-center min-h-screen w-full overflow-hidden bg-slate-900">
    <div class="absolute inset-0 opacity-15 pointer-events-none flex flex-col justify-around py-10">
      <div class="animate-marquee flex gap-6 text-white text-lg font-bold whitespace-nowrap">
        <span>🐾 Pet Supplies</span> • <span>🍳 Kitchen Gadgets</span> • <span>🌱 Garden Tools</span> • <span>💻 Electronics</span> • <span>👟 Fashion & Apparel</span> • <span>🏠 Home Decor</span>
      </div>
    </div>

    <div class="relative z-10 bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 m-4">
      <div class="text-center mb-6 animate-logo">
        <h1 class="text-2xl font-extrabold text-blue-600 flex items-center justify-center gap-2">
          🚀 eBay-Tracer <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full shadow-sm">by Arif</span>
        </h1>
      </div>

      <div class="flex border-b border-gray-200 mb-6">
        <button type="button" id="tab-login" onclick="switchMode('login')" class="w-1/2 py-2 font-bold text-blue-600 border-b-2 border-blue-600 focus:outline-none text-sm cursor-pointer">Sign In</button>
        <button type="button" id="tab-signup" onclick="switchMode('signup')" class="w-1/2 py-2 font-bold text-gray-400 hover:text-blue-600 focus:outline-none text-sm cursor-pointer">Sign Up</button>
      </div>

      <div id="auth-msg" class="hidden p-3 mb-4 text-sm rounded-lg text-center font-medium"></div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
          <input type="email" id="email" class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 bg-gray-50" placeholder="name@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="password" class="w-full border border-gray-300 rounded-xl p-3 pr-10 text-sm focus:ring-2 focus:ring-blue-500 bg-gray-50" placeholder="••••••••">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800 focus:outline-none">
              <i id="eye-icon" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="pt-2">
          <!-- Type button lagaya hai taake form submit na ho aur seedha JS chale -->
          <button type="button" onclick="handleAuth()" id="submit-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg text-sm cursor-pointer">
            Sign In
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD CONTAINER -->
  <div id="dashboard-container" class="hidden w-full min-h-screen flex flex-col bg-gray-50">
    <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-xl bg-blue-600 text-white p-2 rounded-xl shadow-md">📦</span>
        <div>
          <h1 class="font-extrabold text-gray-800 text-lg">eBay-Tracer <span class="text-xs text-blue-600 font-medium">by Arif</span></h1>
        </div>
      </div>
      <button type="button" onclick="handleLogout()" class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-red-600 transition shadow-sm cursor-pointer">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Sign Out
      </button>
    </header>

    <main class="max-w-7xl mx-auto p-6 w-full flex-grow">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Dashboard Loading Successfully! 🎉</h2>
      <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-gray-500 col-span-3 text-center py-10">Products will appear here...</p>
      </div>
    </main>
  </div>

  <script>
    // Console log to verify script is running
    console.log("Script loaded successfully on Mac!");

    let currentMode = 'login';

    function switchMode(mode) {
      currentMode = mode;
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const submitBtn = document.getElementById('submit-btn');

      if (mode === 'login') {
        loginTab.className = "w-1/2 py-2 font-bold text-blue-600 border-b-2 border-blue-600 focus:outline-none text-sm cursor-pointer";
        signupTab.className = "w-1/2 py-2 font-bold text-gray-400 hover:text-blue-600 focus:outline-none text-sm cursor-pointer";
        submitBtn.textContent = "Sign In";
      } else {
        signupTab.className = "w-1/2 py-2 font-bold text-green-600 border-b-2 border-green-600 focus:outline-none text-sm cursor-pointer";
        loginTab.className = "w-1/2 py-2 font-bold text-gray-400 hover:text-green-600 focus:outline-none text-sm cursor-pointer";
        submitBtn.textContent = "Create Account";
      }
    }

    // Password Eye icon toggle function
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    // Simplified Auth Handler to bypass Mac local file restrictions
    function handleAuth() {
      console.log("Sign in button clicked!");
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Please enter email and password to test.");
        return;
      }

      // MAC BYPASS: Seedha dashboard open karega bina database error ke
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('dashboard-container').classList.remove('hidden');
    }

    // Logout Function
    function handleLogout() {
      document.getElementById('dashboard-container').classList.add('hidden');
      document.getElementById('auth-container').classList.remove('hidden');
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
