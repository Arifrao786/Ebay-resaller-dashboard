<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay Dropshipping Dashboard</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        🔑 Reseller Portal
      </h1>
      <p class="text-gray-500 text-sm mt-1">Sign in or create a new account</p>
    </div>

    <!-- Alert Box for Error / Success -->
    <div id="auth-msg" class="hidden p-3 mb-4 text-sm rounded-lg text-center font-medium"></div>

    <!-- Auth Form -->
    <form id="auth-form" class="space-y-4" onsubmit="event.preventDefault();">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter Email">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Enter Password">
      </div>

      <div class="pt-2 space-y-3">
        <button type="button" onclick="handleLogin()" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition duration-200">
          Login
        </button>
        <button type="button" onclick="handleSignUp()" class="w-full bg-gray-700 text-white font-semibold py-2.5 rounded-lg hover:bg-gray-800 transition duration-200">
          Sign Up (New Account)
        </button>
      </div>
    </form>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://doqmnxccvnmvcpneeueu.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvcW1ueGNjdm5tdmNwbmVldWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjI2NzUsImV4cCI6MjEwNDYzODY3NX0.gy5QA0xh_yx26AZ_0d7upHtjCClBvIv48brdRE8NMhY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showMsg(message, isError = false) {
      const msgBox = document.getElementById('auth-msg');
      msgBox.textContent = message;
      msgBox.className = `p-3 mb-4 text-sm rounded-lg text-center font-medium ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
    }

    // Login Function
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showMsg("Please fill in both email and password.", true);
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        showMsg(error.message, true);
      } else {
        showMsg("Login successful! Redirecting...", false);
        // Successful login action
      }
    }

    // Signup Function (Proper Email Signup)
    async function handleSignUp() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showMsg("Please enter email and password to Sign Up.", true);
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      if (error) {
        showMsg(error.message, true);
      } else {
        showMsg("Account created successfully! You can now login.", false);
      }
    }
  </script>
</body>
</html>
