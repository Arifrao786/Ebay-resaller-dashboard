<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Reseller Winning Products</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; text-align: center; }
    .auth-container, .dashboard-container { max-width: 400px; margin: 50px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .dashboard-container { max-width: 1000px; display: none; }
    h2 { margin-bottom: 20px; color: #333; }
    input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 95%; padding: 10px; margin-top: 10px; background: #0070f3; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0051a2; }
    .secondary-btn { background: #333; margin-top: 5px; }
    .secondary-btn:hover { background: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-align: left; }
    .card h3 { margin-top: 0; font-size: 16px; }
    .price { font-size: 14px; color: #555; }
    .profit { font-weight: bold; color: #2e7d32; margin: 8px 0; }
  </style>
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="auth-box" class="auth-container">
    <h2>🔐 Reseller Login</h2>
    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>
    <button onclick="handleLogin()">Login</button>
    <button onclick="handleSignUp()" class="secondary-btn">Sign Up (New Account)</button>
    <p id="auth-msg" style="color: red; margin-top: 10px; font-size: 14px;"></p>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-box" class="dashboard-container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>🚀 Winning Products Dashboard</h2>
      <button onclick="handleLogout()" style="width: auto; padding: 8px 15px; background: #e53935;">Logout</button>
    </div>
    <div id="product-list" class="grid">
      <p>No products found yet. Run the Python script to fetch products.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://doqmnxccvnmvcpneeueu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvcW1ueGNjdm5tdmNwbmVldWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjI2NzUsImV4cCI6MjEwNDYzODY3NX0.gy5QA0xh_yx26AZ_0d7upHtjCClBvIv48brdRE8NMhY";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkUser() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('dashboard-box').style.display = 'block';
        fetchProducts();
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('dashboard-box').style.display = 'none';
      }
    }

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('auth-msg').innerText = error.message;
      } else {
        checkUser();
      }
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await client.auth.signUp({ email, password });
      if (error) {
        document.getElementById('auth-msg').innerText = error.message;
      } else {
        document.getElementById('auth-msg').style.color = "green";
        document.getElementById('auth-msg').innerText = "Account created! Check email or login.";
      }
    }

    async function handleLogout() {
      await client.auth.signOut();
      checkUser();
    }

    async function fetchProducts() {
      const { data, error } = await client.from('products').select('*');
      const container = document.getElementById('product-list');
      if (data && data.length > 0) {
        container.innerHTML = data.map(item => `
          <div class="card">
            <h3>${item.title || 'Product Name'}</h3>
            <div class="price">eBay: $${item.ebay_price || '0.00'}</div>
            <div class="price">Supplier: $${item.supplier_price || '0.00'}</div>
            <div class="profit">Estimated Profit: $${item.profit || '0.00'}</div>
          </div>
        `).join('');
      }
    }

    checkUser();
  </script>
</body>
</html>
